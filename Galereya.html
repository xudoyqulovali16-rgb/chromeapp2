<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galereya</title>
<style>
:root{--t:#fff;--g:rgba(255,255,255,.12);--b:rgba(255,255,255,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{color:var(--t);background:#0b1030;overflow:hidden}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 20% 20%,#7b2ff7 0,transparent 40%),radial-gradient(circle at 80% 30%,#00c6ff 0,transparent 40%),radial-gradient(circle at 50% 90%,#ff4fa3 0,transparent 45%),#0b1030}
.glass{background:var(--g);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1.5px solid var(--b);box-shadow:inset 0 2px 8px rgba(255,255,255,.35),inset 0 -6px 14px rgba(255,255,255,.08),0 12px 32px rgba(0,0,0,.25)}
.drop{border-radius:42% 58% 55% 45%/55% 45% 58% 42%}
#gate{height:100%;display:flex;flex-direction:column;gap:14px;padding:14px;max-width:760px;margin:0 auto;overflow-y:auto}
.gh{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:30px;font-weight:600}
.gh svg{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:34% 66% 58% 42%/48% 40% 60% 52%;opacity:.9}
.tile:nth-child(3n+2){border-radius:60% 40% 44% 56%/42% 58% 42% 58%}
.t1{background:linear-gradient(135deg,#ff9a9e55,#fad0c455)}.t2{background:linear-gradient(135deg,#a1c4fd55,#c2e9fb55)}.t3{background:linear-gradient(135deg,#84fab055,#8fd3f455)}.t4{background:linear-gradient(135deg,#fbc2eb55,#a6c1ee55)}.t5{background:linear-gradient(135deg,#ffecd255,#fcb69f55)}.t6{background:linear-gradient(135deg,#d4fc7955,#96e6a155)}
.lock{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:36px 36px 36px 12px;margin:auto 0 0}
.lock svg{width:26px;height:26px}
.lock small{opacity:.7}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.card{width:min(340px,100%);padding:28px 22px;border-radius:36px 36px 36px 12px;text-align:center}
.card h1{font-size:18px;margin:0 0 16px;font-weight:600}
input[type=password],#txt{width:100%;padding:14px 18px;border-radius:999px;color:#fff;font-size:18px;outline:0;text-align:center;-webkit-user-select:text;user-select:text}
input::placeholder{color:rgba(255,255,255,.6)}
.btn{border:0;color:#fff;cursor:pointer;padding:13px 22px;border-radius:999px;font-size:16px}
.btn.go{margin-top:14px;width:100%}
#err{min-height:20px;margin-top:10px;font-size:13px;color:#ffd2d2}
#app{display:none;height:100%;flex-direction:column;padding:10px;gap:10px;max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:30px}
header .t{flex:1;font-weight:600}
#warn{width:44px;height:44px;border-radius:50%;padding:0;color:#ffd400;background:rgba(255,212,0,.18);border:1.5px solid rgba(255,212,0,.8);cursor:pointer;box-shadow:0 0 16px rgba(255,212,0,.5)}
#out{padding:9px 16px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:12px;border-radius:34px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:24px 24px 24px 8px;word-break:break-word}
.m.me{align-self:flex-end;border-radius:24px 24px 8px 24px;background:rgba(0,198,255,.22)}
.m img,.m video{max-width:100%;max-height:260px;border-radius:20px;display:block;pointer-events:auto}
.m img{pointer-events:none}
.m audio{max-width:220px}
.m small{display:block;opacity:.55;font-size:10px;margin-top:4px}
form{display:flex;gap:8px;align-items:center;padding:8px;border-radius:999px}
form #txt{text-align:left;flex:1;padding:12px 16px}
.ic{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px;flex:none}
.rec{background:rgba(255,60,60,.5)}
body.hide #app{filter:blur(28px)}
@media print{body{display:none}}
</style></head><body>
<div class="bg"></div>
<div id="gate"><div class="gh glass"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Galereya</div>
<div class="grid"><div class="tile glass t1"></div><div class="tile glass t2"></div><div class="tile glass t3"></div><div class="tile glass t4"></div><div class="tile glass t5"></div><div class="tile glass t6"></div></div>
<div class="lock glass"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg><small>Yashirin papka</small>
<input id="code" type="password" inputmode="numeric" placeholder="Kod" autocomplete="off">
<button class="btn glass go" id="enter">Ochish</button><div id="err"></div></div></div>

<div id="app">
<header class="glass"><button id="warn" title="Hammasini o‘chirish"><svg class="ico" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button><div class="t" id="ttl">Chat</div><button id="out" class="btn glass">Chiqish</button></header>
<div id="msgs" class="glass"></div>
<form class="glass" id="f"><button type="button" class="btn glass ic" id="att"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></button>
<input id="txt" class="glass" placeholder="Xabar…" autocomplete="off">
<button type="button" class="btn glass ic" id="mic"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg></button>
<button class="btn glass ic"><svg class="ico" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button><input type="file" id="file" accept="image/*,video/*" hidden></form>
</div>

<script>
// Kodlar SHA-256 xeshlari (4821, 9035, 6174). O‘zgartirish: yangi kodning sha256 qiymatini qo‘ying.
const HASHES=["a388f562e286fdf28986f9253579f4d096446e01dd0c771996a51ff11b390fa2","a655d31f8fc6fec80d8aa921a9fc803a5f5e84d80ce46ec58c6d12c6ebc2c5a9","982cba6c0950686e37519d347bfa51deb9c933de7844a3800973b65d78c4667e"];
const $=id=>document.getElementById(id);
let db,assets,me,ch,unsub,hb,mine=[];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
(async()=>{try{db=await claude.use("db");assets=await claude.use("assets");const u=await claude.use("user");me=u?await u.id():"u"+Math.random().toString(36).slice(2)}catch(e){}
 if(!db)$("err").textContent="Ulanish yo‘q"})();

// nusxa/skrinshotga qarshi himoya
["contextmenu","copy","cut","dragstart","selectstart"].forEach(e=>document.addEventListener(e,ev=>{if(ev.target.id!=="txt"&&ev.target.id!=="code")ev.preventDefault()}));
document.addEventListener("keydown",e=>{if(e.key==="PrintScreen"||(e.ctrlKey||e.metaKey)&&["p","s","c","u"].includes(e.key.toLowerCase())&&e.target.id!=="txt"){e.preventDefault();try{navigator.clipboard.writeText(" ")}catch(_){};document.body.classList.add("hide");setTimeout(()=>document.body.classList.remove("hide"),1500)}});
const hide=()=>document.body.classList.add("hide"),show=()=>document.body.classList.remove("hide");
window.addEventListener("blur",hide);window.addEventListener("focus",show);
document.addEventListener("visibilitychange",()=>document.hidden?hide():show());

$("enter").onclick=async()=>{
 const h=await sha($("code").value.trim());const i=HASHES.indexOf(h);
 if(i<0||!db){$("err").textContent=!db?"Ulanish yo‘q":"Kod noto‘g‘ri";return}
 ch=h.slice(0,12);$("code").value="";$("err").textContent="";
 $("ttl").textContent="Kanal "+(i+1);
 const P=db.collection("p_"+ch),M=db.collection("c_"+ch);
 try{ // 2 daqiqa qoidasi
  const ps=await P.get();let last=0;ps.docs.forEach(d=>{if(d.id!==me)last=Math.max(last,d.data().t||0)});
  const mine0=(await P.doc(me).get());const own=mine0.exists?mine0.data().t||0:0;
  if(Date.now()-Math.max(last,own)>120000)await wipe();
 }catch(e){}
 const beat=()=>P.doc(me).set({t:Date.now()}).catch(()=>{});beat();hb=setInterval(beat,15000);
 $("gate").style.display="none";$("app").style.display="flex";
 unsub=M.orderBy("t").onSnapshot(s=>render(s.docs.map(d=>d.data())));
};
async function wipe(){
 const M=db.collection("c_"+ch);const s=await M.get();
 for(const d of s.docs){const x=d.data();if(x.aid&&x.u===me&&assets)assets.delete(x.aid).catch(()=>{});await d.ref?.delete?.().catch(()=>{})||await M.doc(d.id).delete().catch(()=>{})}
}
function leave(){clearInterval(hb);unsub&&unsub();if(db&&ch)db.collection("p_"+ch).doc(me).set({t:Date.now()}).catch(()=>{});ch=null;$("app").style.display="none";$("gate").style.display="flex";$("msgs").innerHTML=""}
$("out").onclick=leave;window.addEventListener("pagehide",()=>{if(ch)db.collection("p_"+ch).doc(me).set({t:Date.now()}).catch(()=>{})});
$("warn").onclick=async()=>{$("msgs").innerHTML="";await wipe()}; // rozilik so‘ralmaydi

function render(ms){
 const box=$("msgs");box.innerHTML="";
 ms.forEach(m=>{const d=document.createElement("div");d.className="m glass"+(m.u===me?" me":"");
  if(m.k==="text")d.textContent=m.v;
  else{const el=document.createElement(m.k==="image"?"img":m.k==="video"?"video":"audio");el.src=m.v;
   if(m.k!=="image"){el.controls=true;el.setAttribute("controlsList","nodownload noplaybackrate");el.disablePictureInPicture=true}
   d.appendChild(el)}
  const s=document.createElement("small");s.textContent=new Date(m.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});d.appendChild(s);box.appendChild(d)});
 box.scrollTop=box.scrollHeight;
}
const send=(k,v,aid)=>db.collection("c_"+ch).doc("m"+Date.now()+Math.random().toString(36).slice(2,6)).set({u:me,k,v,aid:aid||null,t:Date.now()}).catch(()=>{});
$("f").onsubmit=e=>{e.preventDefault();const v=$("txt").value.trim();if(v){send("text",v);$("txt").value=""}};
async function up(blob,k){if(!assets){alert("Fayl yuklash mavjud emas");return}try{const r=await assets.upload(blob);send(k,r.url,r.id)}catch(e){alert("Yuklab bo‘lmadi")}}
$("att").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(f)up(f,f.type.startsWith("video")?"video":"image");e.target.value=""};
let rec,chunks;
$("mic").onclick=async()=>{
 if(rec&&rec.state==="recording"){rec.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());$("mic").classList.remove("rec");up(new Blob(chunks,{type:rec.mimeType||"audio/webm"}),"audio")};
  rec.start();$("mic").classList.add("rec")}catch(e){alert("Mikrofon ruxsati kerak")}
};
</script></body></html>
